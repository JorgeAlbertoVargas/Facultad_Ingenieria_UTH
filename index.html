<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIngenieria</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Principal -->
    <link rel="stylesheet" href="./css/styles.css?v=2">
</head>
<body>

    <!-- Contenedor Principal de la App -->
    <div id="app">
        <!-- Pantalla de Login -->
        <div id="login-view" class="view active">
            <div class="login-container">
                <div class="login-image-side">
                    <div class="overlay">
                        <h1>Feria Facultad Ingenieria</h1>
                        <p>Plataforma oficial de evaluación de proyectos de ingeniería.</p>
                    </div>
                </div>
                <div class="login-form-side">
                    <div class="login-card">
                        <div class="login-header">
                            <img src="https://www.uth.hn/wp-content/uploads/2026/01/logo-40-aniversario.png" alt="UTH Logo" class="login-logo">
                            <p>Bienvenido, inicie sesión para continuar</p>
                        </div>
                        <form id="login-form">
                            <div class="input-group">
                                <label for="email">Correo Institucional</label>
                                <input type="email" id="email" required placeholder="correo@uth.hn">
                            </div>
                            <div class="input-group">
                                <label for="password">Contraseña</label>
                                <input type="password" id="password" required placeholder="••••••••">
                            </div>
                            <button type="submit" class="btn btn-primary btn-large">Iniciar Sesión</button>
                            <p class="error-msg" id="login-error"></p>
                            <div style="margin-top: 15px; text-align: center;">
                                <span style="font-size: 14px; color: var(--text-muted);">¿No tienes cuenta? <a href="#" id="link-to-register" style="color: var(--primary); font-weight: 600; text-decoration: none;">Regístrate aquí</a></span>
                            </div>
                        </form>

                        <form id="register-form" style="display: none; text-align: left;">
                            <div class="input-group">
                                <label for="reg-name">Nombre Completo</label>
                                <input type="text" id="reg-name" required placeholder="Juan Pérez">
                            </div>
                            <div class="input-group">
                                <label for="reg-email">Correo Institucional</label>
                                <input type="email" id="reg-email" required placeholder="correo@uth.hn">
                            </div>
                            <div class="input-group">
                                <label for="reg-password">Contraseña</label>
                                <input type="password" id="reg-password" required placeholder="••••••••">
                            </div>
                            <button type="submit" class="btn btn-primary btn-large">Crear Cuenta</button>
                            <p class="error-msg" id="register-error"></p>
                            <div style="margin-top: 15px; text-align: center;">
                                <span style="font-size: 14px; color: var(--text-muted);">¿Ya tienes cuenta? <a href="#" id="link-to-login" style="color: var(--primary); font-weight: 600; text-decoration: none;">Inicia sesión</a></span>
                            </div>
                        </form>

                        <div class="public-links">
                            <button id="btn-public-map" class="btn btn-text">Ir al Mapa Público de Proyectos</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Layout de la App Autenticada -->
        <div id="main-layout" class="view">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <img src="https://www.uth.hn/wp-content/uploads/2026/01/logo-40-aniversario.png" alt="UTH Logo" class="sidebar-logo">
                    <span id="user-role-badge" class="badge">Evaluador</span>
                </div>
                <nav class="sidebar-nav">
                    <ul id="nav-menu">
                        <!-- Generado dinámicamente según el rol -->
                    </ul>
                </nav>
                <div id="user-terna-info" style="font-size: 13px; color: var(--text-muted); margin: 0 20px 20px 20px; padding: 12px; background: rgba(0,0,0,0.02); border-radius: 4px; display: none;">
                    <strong style="color: var(--primary); font-size: 14px;">Terna: <span id="user-terna-name">...</span></strong><br>
                    <div style="margin-top: 8px; font-weight: 500;">Compañeros:</div>
                    <div id="user-terna-colleagues" style="margin-top: 5px;">...</div>
                </div>
                <div class="sidebar-footer">
                    <div class="user-info">
                        <i class="fas fa-user-circle"></i>
                        <span id="user-name">Usuario</span>
                    </div>
                    <button id="btn-logout" class="btn btn-icon"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </aside>

            <!-- Contenido Principal -->
            <main class="main-content">
                <!-- Vistas dinámicas inyectadas aquí -->
                <div id="content-area"></div>
            </main>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script src="./js/api.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/judge.js"></script>
    <script src="./js/admin.js"></script>
    <script src="./js/map.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
